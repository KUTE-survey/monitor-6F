<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>室内環境モニター</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; background: #14171c; color: #eee; }
  .wrap { height: 100vh; display: grid; grid-template-columns: 1fr 1fr; gap: 2vh 2vw; padding: 2.5vh 2vw; }
  .col { display: flex; flex-direction: column; gap: 2vh; min-height: 0; min-width: 0; }

  .panel { flex: 1; min-height: 0; background: #1e232b; border-radius: 2vh; padding: 1.5vh 1.5vw;
           display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .p-lbl { font-size: clamp(12px, 2.4vh, 24px); color: #9aa4b2; }
  .p-val { font-weight: 700; line-height: 1.05; font-size: clamp(36px, 15vh, 140px); }
  .p-unit { font-size: 0.4em; margin-left: 0.1em; color: #9aa4b2; font-weight: 400; }
  .p-badge { margin-top: 0.8vh; font-size: clamp(12px, 2.6vh, 26px); padding: 0.3vh 1.2vw; border-radius: 999px; font-weight: 600; }
  .st-low  { color: #5aa9ff; } .bd-low  { background: #17314f; color: #8ec5ff; }
  .st-ok   { color: #5ed17a; } .bd-ok   { background: #17391f; color: #8bf0a3; }
  .st-high { color: #ff6b5e; } .bd-high { background: #4a1d1a; color: #ff9d94; }
  .st-none { color: #666; }   .bd-none { background: #2a2f38; color: #888; }
  .p-range { margin-top: 0.6vh; font-size: clamp(10px, 1.8vh, 18px); color: #6f7a89; }

  .right { background: #1e232b; border-radius: 2vh; padding: 1.5vh 1.5vw; align-items: center; gap: 1vh; }
  .title { font-size: clamp(14px, 3vh, 30px); font-weight: 700; text-align: center; }
  .sub { font-size: clamp(10px, 1.8vh, 18px); color: #6f7a89; }
  .change { width: 100%; text-align: center; background: #2a3140; border-radius: 1.2vh; padding: 0.8vh 1vw;
            font-size: clamp(11px, 2.1vh, 22px); color: #ffd87a; }
  .change.none { color: #6f7a89; }
  .chart-box { position: relative; flex: 1; min-height: 0; width: 100%; }
  .legend { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4vh 1vw; font-size: clamp(10px, 1.9vh, 19px); }
  .lg { display: flex; align-items: center; gap: 0.6vw; white-space: nowrap; }
  .dot { width: 1.4vh; height: 1.4vh; border-radius: 50%; flex-shrink: 0; }
  .lg .n { margin-left: auto; font-weight: 600; }
  #rotate { display: none; position: fixed; inset: 0; background: #14171c; z-index: 9; align-items: center; justify-content: center; font-size: 20px; text-align: center; padding: 20px; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="rotate">横向きにしてご覧ください</div>
<div class="wrap">
  <div class="col">
    <div class="panel">
      <div class="p-lbl">室温</div>
      <div class="p-val st-none" id="t-val">--<span class="p-unit">°C</span></div>
      <span class="p-badge bd-none" id="t-badge">取得中</span>
      <div class="p-range">快適域 20〜24°C</div>
    </div>
    <div class="panel">
      <div class="p-lbl">湿度</div>
      <div class="p-val st-none" id="h-val">--<span class="p-unit">%</span></div>
      <span class="p-badge bd-none" id="h-badge">取得中</span>
      <div class="p-range">快適域 30〜60%</div>
    </div>
  </div>

  <div class="col right">
    <div class="title" id="title">みんなの感じ方</div>
    <div class="sub" id="sub">回答 -- 件 / 更新 --:--</div>
    <div class="change none" id="change">設定変更の履歴はありません</div>
    <div class="chart-box"><canvas id="pie"></canvas></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
// ★★★ フロアごとに変更する設定 ★★★
const GAS_URL = 'https://script.google.com/macros/s/AKfycbztOh47vSIsmElKuD0fgze3zc7svCXh7FGFVR2wLZyc4bodUxqG_pDQBU_goCZI1phhuw/exec';
const FLOOR_NAME = '6F';   // 例: '5F'

// 冬期の閾値
const TEMP_LOW = 20, TEMP_HIGH = 25;
const HUM_LOW = 30, HUM_HIGH = 60;

if (FLOOR_NAME) document.getElementById('title').textContent = FLOOR_NAME + ' みんなの感じ方';

const OPTS = [
  { label:'とても暑い',   form:'とても暑い（汗ばむほど暑い）',     color:'#D85A30' },
  { label:'やや暑い',     form:'やや暑い（少し暑さを感じる）',     color:'#EF9F27' },
  { label:'ちょうどよい', form:'ちょうどよい（快適）',             color:'#639922' },
  { label:'やや寒い',     form:'やや寒い（少し肌寒い）',           color:'#378ADD' },
  { label:'とても寒い',   form:'とても寒い（震えてしまうほど寒い）', color:'#534AB7' },
];

function setVal(valId, badgeId, v, unit, low, high, lowTxt, highTxt, highInclusive) {
  const val = document.getElementById(valId), badge = document.getElementById(badgeId);
  if (typeof v !== 'number') {
    val.className = 'p-val st-none'; badge.className = 'p-badge bd-none'; badge.textContent = 'データなし';
    val.innerHTML = '--<span class="p-unit">' + unit + '</span>'; return;
  }
  const isLow = v < low;
  const isHigh = highInclusive ? v >= high : v > high;
  const k = isLow ? 'low' : isHigh ? 'high' : 'ok';
  val.className = 'p-val st-' + k;
  badge.className = 'p-badge bd-' + k;
  badge.textContent = isLow ? lowTxt : isHigh ? highTxt : '快適';
  val.innerHTML = v + '<span class="p-unit">' + unit + '</span>';
}

function loadSensor() {
  fetch('./data.json?t=' + Date.now()).then(r => r.json()).then(d => {
    setVal('t-val', 't-badge', d.temperature, '°C', TEMP_LOW, TEMP_HIGH, '低め', '高め', true);
    setVal('h-val', 'h-badge', d.humidity, '%', HUM_LOW, HUM_HIGH, '乾燥', '高湿', false);
  }).catch(() => {});
}

function loadLog() {
  fetch('./log.json?t=' + Date.now()).then(r => r.json()).then(list => {
    const el = document.getElementById('change');
    if (!Array.isArray(list) || list.length === 0) return;
    const latest = list.slice().sort((a, b) => String(a.datetime).localeCompare(String(b.datetime))).pop();
    const m = String(latest.datetime).match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
    const when = m ? `${+m[2]}/${+m[3]} ${+m[4]}:${m[5]}` : latest.datetime;
    el.textContent = `${when} に${latest.text}`;
    el.className = 'change';
  }).catch(() => {});
}

const pie = new Chart(document.getElementById('pie'), {
  type: 'doughnut',
  data: { labels: OPTS.map(o => o.label),
          datasets: [{ data: [0,0,0,0,0], backgroundColor: OPTS.map(o => o.color), borderColor:'#1e232b', borderWidth:2 }] },
  options: { responsive:true, maintainAspectRatio:false, cutout:'55%', animation:false,
             plugins:{ legend:{ display:false }, tooltip:{ enabled:false } } }
});

function renderLegend(counts, total) {
  document.getElementById('legend').innerHTML = OPTS.map(o => {
    const c = counts[o.form] || 0;
    const p = total > 0 ? Math.round(c / total * 100) : 0;
    return `<div class="lg"><span class="dot" style="background:${o.color}"></span>${o.label}<span class="n">${p}%</span></div>`;
  }).join('');
}

function loadGAS() {
  const cb = 'gasCb_' + Date.now();
  const s = document.createElement('script');
  s.src = GAS_URL + '?callback=' + cb;
  window[cb] = function(data) {
    if (data && data.counts) {
      pie.data.datasets[0].data = OPTS.map(o => data.counts[o.form] || 0);
      pie.update();
      renderLegend(data.counts, data.total);
      const now = new Date();
      document.getElementById('sub').textContent =
        `回答 ${data.total} 件 / 更新 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
    delete window[cb]; s.remove();
  };
  s.onerror = function() { delete window[cb]; s.remove(); };
  document.head.appendChild(s);
}

renderLegend({}, 0);
loadSensor(); loadLog(); loadGAS();
setInterval(loadSensor, 60 * 1000);
setInterval(loadLog, 5 * 60 * 1000);
setInterval(loadGAS, 60 * 1000);
</script>
</body>
</html>
